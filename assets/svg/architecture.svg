<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" font-family="Noto Sans JP, Noto Sans CJK JP, Yu Gothic, Meiryo, sans-serif">
  <title>システム構成の例（利用者・API・バッチ・データベース・ストレージ）</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <g font-size="20" text-anchor="middle">
    <rect x="20" y="140" width="160" height="80" rx="12" fill="#f3f4f6" stroke="#9ca3af"/>
    <text x="100" y="187">利用者</text>
    <rect x="280" y="40" width="200" height="80" rx="12" fill="#dbeafe" stroke="#1d4ed8"/>
    <text x="380" y="87">API（コンテナ）</text>
    <rect x="280" y="240" width="200" height="80" rx="12" fill="#dbeafe" stroke="#1d4ed8"/>
    <text x="380" y="287">バッチ（ジョブ）</text>
    <rect x="600" y="40" width="200" height="80" rx="12" fill="#fff7ed" stroke="#ea580c"/>
    <text x="700" y="87">データベース</text>
    <rect x="600" y="240" width="200" height="80" rx="12" fill="#fff7ed" stroke="#ea580c"/>
    <text x="700" y="287">ストレージ</text>
  </g>
  <g stroke="#1d4ed8" stroke-width="3" fill="none" marker-end="url(#arrow)">
    <path d="M180,170 L278,90"/>
    <path d="M480,80 L598,80"/>
    <path d="M480,280 L598,280"/>
    <path d="M380,240 L380,122"/>
    <path d="M480,260 L598,100"/>
  </g>
  <text x="560" y="350" font-size="14" fill="#6b7280" text-anchor="middle">図は SVG で書くと、拡大しても崩れず、差分もレビューできる</text>
</svg>
