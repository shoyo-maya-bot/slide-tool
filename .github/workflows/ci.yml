name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  slides:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Japanese fonts
        run: sudo apt-get update -q && sudo apt-get install -y -q fonts-noto-cjk
      - run: npm install --no-audit --no-fund
      - run: npx playwright install chromium
      - name: unit tests
        run: npm test
      - name: lint (text volume, titles, SVG)
        run: npm run lint
      - name: overflow check (rendered)
        run: npm run check:overflow
      - name: build PDF / PPTX / catalog
        run: npm run pdf && npm run pptx && npm run catalog
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: slides
          path: dist/
