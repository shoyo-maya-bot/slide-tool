name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  slides:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      # 日本語フォントは OS に入れず、package-lock.json で固定した @fontsource/noto-sans-jp（テーマに同梱）を使う
      - run: npm ci --no-audit --no-fund
      # 依存の既知の脆弱性（npm audit --audit-level=high と同じ基準）。上流待ちのものだけ config/audit-allowlist.json に理由と期限付きで許可
      - name: dependency audit (high and above)
        run: npm run audit
      - name: bundled font and its license are installed
        run: test -f node_modules/@fontsource/noto-sans-jp/400.css && test -f node_modules/@fontsource/noto-sans-jp/LICENSE
      # スクリプトの静的検査（ESLint の recommended。warning も失敗: --max-warnings 0）と書式（Prettier）
      - name: ESLint (scripts and tests)
        run: npm run lint:js
      - name: Prettier (scripts and tests)
        run: npm run format:check
      - run: npx playwright install chromium
      - name: unit tests
        run: npm test
      - name: lint (text volume, titles, SVG)
        run: npm run lint
      # 既定（HTML とローカルのファイルを無効）の出力も止まらないことを確かめる。後の trusted の出力で dist/ を上書きする
      - name: default (untrusted) build does not fail
        run: npm run pdf
      # リポジトリ同梱の資料（slides/ のサンプルとレイアウト集）は信頼できる資料なので、HTML を有効にして確かめる
      - name: overflow check (rendered, default settings like npm run pdf)
        run: npm run check:overflow
      - name: overflow check (rendered, trusted bundled decks)
        run: npm run check:overflow:trusted
      - name: no leftover measurement build
        run: "! ls -d build/check* 2>/dev/null"
      - name: build PDF / PPTX / catalog (trusted bundled decks)
        run: npm run pdf:trusted && npm run pptx:trusted && npm run catalog
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: slides
          path: dist/

  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      # はみ出しのテストは CI ではスキップしないので、Windows でもブラウザを入れる
      - run: npx playwright install chromium
      - name: unit tests
        run: npm test
      - name: lint (text volume, titles, SVG)
        run: npm run lint
      # Windows でも PDF を出せることを確かめる（同梱フォントの file:// URL・ドライブ名付きのパスを含む）
      - name: overflow check (trusted bundled decks)
        run: npm run check:overflow:trusted
      - name: build PDF (default and trusted)
        run: npm run pdf && npm run pdf:trusted
      - name: PDF was written
        shell: bash
        run: |
          set -euo pipefail
          for f in dist/*.pdf; do
            test -s "$f"
            head -c 5 "$f" | grep -q '%PDF-'
            echo "ok: $f ($(wc -c < "$f") bytes)"
          done
          ls dist/*.pdf
      # 測定用の一時フォルダ（build/check-*）が残っていない
      - name: no leftover measurement build
        shell: bash
        run: "! ls -d build/check* 2>/dev/null"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: slides-windows
          path: dist/
